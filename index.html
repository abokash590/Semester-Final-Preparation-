  <!-- Active Extension Immunity Guard: Blocks Dark Reader, Night Eye & Force-Dark Extensions -->
  <script>
    (function () {
      function neutralize() {
        document.querySelectorAll('style.darkreader, style[class*="darkreader"], link[class*="darkreader"], style[class*="sdm"]').forEach(function (el) {
          try { el.remove(); } catch (e) {}
        });
        ['data-darkreader-mode', 'data-darkreader-scheme', 'data-darkreader-proxy'].forEach(function (attr) {
          if (document.documentElement.hasAttribute(attr)) {
            document.documentElement.removeAttribute(attr);
          }
        });
        if (document.documentElement.style.filter || (document.body && document.body.style.filter)) {
          document.documentElement.style.filter = 'none';
          if (document.body) document.body.style.filter = 'none';
        }
      }
      neutralize();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', neutralize);
      }
      try {
        var obs = new MutationObserver(function (mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var m = mutations[i];
            for (var j = 0; j < m.addedNodes.length; j++) {
              var n = m.addedNodes[j];
              if (n.nodeType === 1) {
                var tag = n.tagName;
                if (tag === 'STYLE' || tag === 'LINK') {
                  var cls = (n.className && typeof n.className === 'string') ? n.className.toLowerCase() : '';
                  var nid = (n.id && typeof n.id === 'string') ? n.id.toLowerCase() : '';
                  if (cls.indexOf('darkreader') !== -1 || nid.indexOf('darkreader') !== -1 || cls.indexOf('sdm') !== -1) {
                    try { n.remove(); } catch (e) {}
                  }
                }
              }
            }
            if (m.type === 'attributes') {
              if (m.attributeName && m.attributeName.indexOf('darkreader') !== -1) {
                document.documentElement.removeAttribute(m.attributeName);
              }
              if (m.attributeName === 'style') {
                if (document.documentElement.style.filter) document.documentElement.style.filter = 'none';
                if (document.body && document.body.style.filter) document.body.style.filter = 'none';
              }
            }
          }
        });
        obs.observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['data-darkreader-mode', 'data-darkreader-scheme', 'style', 'class']
        });
      } catch (e) {}
    })();
  </script>
