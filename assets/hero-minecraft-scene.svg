<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 420' width='100%' height='100%' preserveAspectRatio='xMidYMid slice'>
  <defs>
    <linearGradient id='skyGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#88C5F4'/>
      <stop offset='60%' stop-color='#B8E2FB'/>
      <stop offset='100%' stop-color='#E6F4FD'/>
    </linearGradient>
    <linearGradient id='sunGlow' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#FFF9D2' stop-opacity='0.8'/>
      <stop offset='100%' stop-color='#FFF' stop-opacity='0'/>
    </linearGradient>
    <linearGradient id='mountGrad1' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#8BB3D9'/>
      <stop offset='100%' stop-color='#B0D2EB'/>
    </linearGradient>
    <linearGradient id='mountGrad2' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#6C9BC4'/>
      <stop offset='100%' stop-color='#8DBBDC'/>
    </linearGradient>
    <linearGradient id='grassGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#74BF5D'/>
      <stop offset='25%' stop-color='#589945'/>
      <stop offset='100%' stop-color='#845A34'/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width='1200' height='420' fill='url(#skyGrad)'/>

  <!-- Sun Glow -->
  <circle cx='680' cy='120' r='180' fill='url(#sunGlow)'/>
  <rect x='665' y='105' width='30' height='30' fill='#FFFDE8' opacity='0.9'/>

  <!-- Voxel Clouds (High in sky) -->
  <g fill='#FFFFFF' opacity='0.95'>
    <!-- Cloud 1 -->
    <rect x='80' y='60' width='140' height='24' rx='2'/>
    <rect x='110' y='46' width='80' height='20' rx='2'/>
    <rect x='150' y='72' width='90' height='16' rx='2'/>
    <!-- Cloud 2 -->
    <rect x='440' y='80' width='180' height='28' rx='2'/>
    <rect x='480' y='64' width='110' height='22' rx='2'/>
    <!-- Cloud 3 -->
    <rect x='820' y='50' width='160' height='26' rx='2'/>
    <rect x='860' y='36' width='90' height='18' rx='2'/>
  </g>

  <!-- Distant Voxel Mountain Peaks -->
  <g fill='url(#mountGrad1)' opacity='0.85'>
    <path d='M380,320 L480,180 L520,180 L540,210 L600,160 L640,160 L740,320 Z'/>
    <path d='M220,320 L300,210 L340,210 L420,320 Z'/>
  </g>

  <!-- Mid-distance Mountains with Castle/Tower Silhouettes -->
  <g fill='url(#mountGrad2)'>
    <path d='M460,340 L530,230 L560,230 L600,270 L660,200 L710,200 L810,340 Z'/>
    <!-- Castle Turret -->
    <rect x='670' y='175' width='24' height='30'/>
    <rect x='666' y='168' width='32' height='8'/>
    <rect x='668' y='162' width='6' height='6'/>
    <rect x='678' y='162' width='8' height='6'/>
    <rect x='690' y='162' width='6' height='6'/>
  </g>

  <!-- Waterfalls into Lake -->
  <rect x='575' y='270' width='8' height='60' fill='#A5D8F7' opacity='0.9'/>
  <rect x='573' y='325' width='16' height='12' fill='#D2EEFC' opacity='0.8'/>

  <!-- Rolling Forefront Hills (Left/Center) -->
  <path d='M-20,380 Q160,310 360,350 Q560,380 720,340 L720,420 L-20,420 Z' fill='#68AB4F'/>
  <path d='M-20,395 Q140,340 320,370 L320,420 L-20,420 Z' fill='#4E8739'/>

  <!-- Right Side Grassy Cliff (Where Steve & Wolf sit overlooking the world) -->
  <!-- Dirt Base of Cliff -->
  <path d='M760,420 L760,280 L840,280 L840,250 L920,250 L920,230 L1220,230 L1220,420 Z' fill='#7A5332'/>
  <!-- Stone Insets in Cliff -->
  <rect x='820' y='320' width='36' height='24' fill='#7A8576'/>
  <rect x='930' y='290' width='44' height='28' fill='#6E786B'/>
  <rect x='870' y='360' width='50' height='30' fill='#7A8576'/>
  <rect x='1040' y='310' width='60' height='36' fill='#667063'/>
  <!-- Green Grass Top Layer with Voxel Steppes -->
  <path d='M756,280 L836,280 L836,250 L916,250 L916,230 L1220,230 L1220,250 L924,250 L924,270 L844,270 L844,300 L756,300 Z' fill='#5DA343'/>
  <!-- Top Grass Surface -->
  <rect x='916' y='224' width='304' height='12' fill='#77C959'/>
  <rect x='836' y='244' width='84' height='10' fill='#77C959'/>
  <rect x='756' y='274' width='84' height='10' fill='#77C959'/>

  <!-- Steve & Pet Wolf sitting on the cliff ledge -->
  <g transform='translate(950, 158)'>
    <!-- Steve (Sitting, looking left at sunrise) -->
    <!-- Head -->
    <rect x='28' y='12' width='16' height='16' fill='#C68C5E'/>
    <!-- Hair -->
    <rect x='26' y='8' width='20' height='8' fill='#442713'/>
    <rect x='26' y='14' width='4' height='6' fill='#442713'/>
    <!-- Cyan Shirt / Torso -->
    <rect x='26' y='28' width='18' height='20' fill='#1A959B'/>
    <!-- Cape / Red accent -->
    <rect x='42' y='28' width='6' height='24' fill='#BD2C2C'/>
    <!-- Blue Pants (Sitting) -->
    <rect x='18' y='46' width='26' height='14' fill='#2A3C8E'/>
    <!-- Shoes -->
    <rect x='14' y='54' width='12' height='6' fill='#4A4A4A'/>

    <!-- Pet Wolf (Sitting beside Steve on his right) -->
    <g transform='translate(56, 18)'>
      <!-- Wolf Body -->
      <rect x='6' y='18' width='18' height='22' fill='#D7D7D7'/>
      <!-- Red Collar -->
      <rect x='2' y='16' width='12' height='4' fill='#BE2B2B'/>
      <!-- Wolf Head -->
      <rect x='0' y='6' width='14' height='12' fill='#E8E8E8'/>
      <!-- Snout -->
      <rect x='-4' y='11' width='6' height='6' fill='#D0D0D0'/>
      <rect x='-5' y='11' width='2' height='3' fill='#222'/> <!-- Nose -->
      <!-- Ears -->
      <rect x='2' y='1' width='3' height='6' fill='#9E9E9E'/>
      <rect x='9' y='1' width='3' height='6' fill='#9E9E9E'/>
      <!-- Eye -->
      <rect x='2' y='8' width='2' height='3' fill='#222'/>
      <!-- Tail -->
      <rect x='22' y='30' width='6' height='10' fill='#C0C0C0'/>
      <!-- Legs (Sitting) -->
      <rect x='4' y='36' width='6' height='6' fill='#B0B0B0'/>
    </g>

    <!-- White Daisy / Flower near wolf -->
    <rect x='88' y='52' width='2' height='12' fill='#478C2E'/>
    <rect x='84' y='48' width='10' height='6' fill='#FFF'/>
    <rect x='87' y='49' width='4' height='4' fill='#FFD438'/>
  </g>

  <!-- Oak Tree Foliage Canopy (Overhanging Top-Right Corner) -->
  <g fill='#45822B'>
    <rect x='1080' y='0' width='140' height='90'/>
    <rect x='1020' y='0' width='80' height='70'/>
    <rect x='960' y='0' width='70' height='45'/>
    <rect x='1110' y='75' width='100' height='45'/>
  </g>
  <g fill='#5CA838'>
    <rect x='1090' y='8' width='120' height='60'/>
    <rect x='1030' y='10' width='60' height='45'/>
    <rect x='970' y='8' width='50' height='26'/>
    <rect x='1120' y='80' width='70' height='28'/>
  </g>
  <g fill='#74BF48'>
    <rect x='1100' y='16' width='80' height='36'/>
    <rect x='1040' y='18' width='40' height='28'/>
    <rect x='1135' y='84' width='45' height='16'/>
  </g>
  <!-- Tree Trunk Branch -->
  <rect x='1160' y='50' width='30' height='130' fill='#6D4A27'/>
  <rect x='1130' y='90' width='35' height='20' fill='#5E3E1F'/>
</svg>